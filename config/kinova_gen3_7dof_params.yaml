/**:
  ros__parameters:
    # --- HARDWARE PARAMETERS (Default global) ---
    hardware:
      port_name: "/dev/ttyACM0"
      baudrate: 1000000
      servo_ids: [1, 2, 3, 4, 5, 6, 7, 8]
      servo_center: 2047
      live_torque_limit: 1
      stiff_torque_limit: 400
      deadband: 5

    # --- REALSENSE WRIST CAMERA PARAMETERS (Default global) ---
    camera:
      enable_color: true
      enable_depth: true
      rgb_profile: "640x480x30"
      depth_profile: "640x480x30"

    # --- GRIPPER MAPPING (ROBOTIQ ON KINOVA - Default global) ---
    gripper:
      encoder_close: 2047.0
      encoder_open: 2435.0
      robotiq_close: 0.8
      robotiq_open: 0.0

    # --- HYBRID CONTROL TUNING (Default global) ---
    control:
      arm_backend_type: "kinova"
      velocity_smoothing_factor: 0.15
      max_correction_velocity: 0.4
      kp_position_corrector: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
      admittance_gain: 0.2
      max_joint_velocities_deg: [15.0, 17.5, 15.0, 25.0, 25.0, 30.0, 25.0]
      continuous_joints: [0, 2, 4, 6]  # Array indices untuk wrap-around protection (Joint 1, 3, 5, 7)


/right_/harvest_teleop_core_node:
  ros__parameters:
    hardware:
      port_name: "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5B14113015-if00"
    kinematics:
      arm_joint_names: ["joint_1", "joint_2", "joint_3", "joint_4", "joint_5", "joint_6", "joint_7"]
      joint_signs: [1, 1, 1, 1, 1, 1, 1] 
      #home_radians: [-1.04940, 0.38739, -2.90871, -2.14551, -0.18431, -0.62683, 2.44140]
      home_radians: [0.00126, 0.18837, -3.11828, -2.10992, -0.03365, -0.83863, 1.60368]
    gripper:
      encoder_close: 2047.0
